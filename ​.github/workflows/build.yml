name: Build Lanchorna
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Dummy APK
        run: |
          mkdir -p build/outputs/apk/debug
          echo "Lanchorna APK Placeholder" > build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lanchorna-APK
          path: build/outputs/apk/debug/app-debug.apk
